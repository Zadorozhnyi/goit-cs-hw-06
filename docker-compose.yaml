version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    volumes:
      - ./data:/app/data  # Локальне збереження даних веб-додатку (за потреби)

  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db  # Використання volume для збереження бази даних

volumes:
  mongo_data:  # Оголошуємо volume для MongoDB
